<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#ffffff" />
  <rect x="70" y="80" width="300" height="120" rx="20" fill="#0f172a" />
  <text x="90" y="150" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20" font-weight="700">PDF Parsing</text>
  <rect x="430" y="80" width="300" height="120" rx="20" fill="#1d4ed8" />
  <text x="450" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Embedding</text>
  <rect x="790" y="80" width="300" height="120" rx="20" fill="#065f46" />
  <text x="820" y="150" fill="#e7f5ff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Ranking + Skills</text>
  <path d="M370 140 C 410 140, 430 140, 430 140" stroke="#0f172a" stroke-width="10" fill="none" marker-end="url(#arrow)" />
  <path d="M730 140 C 770 140, 790 140, 790 140" stroke="#0f172a" stroke-width="10" fill="none" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f172a" />
    </marker>
  </defs>
  <rect x="190" y="260" width="820" height="360" rx="24" fill="#f8fafc" stroke="#d1d5db" stroke-width="2"/>
  <text x="240" y="310" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Pipeline Overview</text>
  <text x="240" y="360" fill="#334155" font-family="Arial, sans-serif" font-size="18">1. Upload resumes and JD → parse raw text</text>
  <text x="240" y="400" fill="#334155" font-family="Arial, sans-serif" font-size="18">2. Compute embeddings and build FAISS index</text>
  <text x="240" y="440" fill="#334155" font-family="Arial, sans-serif" font-size="18">3. Rank resumes, extract skills, run LLM summary</text>
  <text x="240" y="480" fill="#334155" font-family="Arial, sans-serif" font-size="18">4. Display results and recommendations in Streamlit</text>
</svg>