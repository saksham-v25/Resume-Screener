target-version = "py310"
line-length = 100
src = [".", "utils", "agents", "vectorstore", "config", "tests"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "C4",
    "SIM",
]

ignore = [
    "E501",
    "B008",
    "N806",
]

[lint.isort]
known-first-party = ["config", "utils", "agents", "vectorstore"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"