[tool.ruff]
target-version = "py310"
line-length = 100
src = [".", "utils", "agents", "vectorstore", "config", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (black handles this)
    "B008",   # do not perform function calls in default args
    "N806",   # variable in function should be lowercase (false positives on numpy)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "utils", "agents", "vectorstore"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
